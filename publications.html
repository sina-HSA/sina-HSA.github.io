const ME_SRC = "S\\. Darabi-Moghaddam|S\\. Darabi";
const ME = ME_SRC ? new RegExp(ME_SRC, "g") : null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = document.getElementById("pub-list");
let filter = "all", query = "";
function render(){
  const items = PUBS
    .filter(p => filter === "all" || p.type === filter || (filter === "top" && p.badge))
    .filter(p => [p.title, p.authors, p.venue, p.short].join(" ").toLowerCase().includes(query))
    .sort((a, b) => b.y - a.y);
  if(!items.length){ list.innerHTML = '<p class="sub" style="margin-top:24px">No matching publications.</p>'; return; }
  let out = "", year = null;
  for(const p of items){
    if(p.y !== year){ year = p.y; out += `<h3 class="pub-year">${year}</h3>`; }
    const title = p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    const authors = ME ? esc(p.authors).replace(ME, "<b>$&</b>") : esc(p.authors);
    const badge = p.badge ? `<span class="badge">${esc(p.badge)}</span>` : "";
    out += `<article class="pub"><span class="venue">${esc(p.short)}</span><div><div class="t">${title}</div><div class="a">${authors}</div><div class="v">${esc(p.venue)}${badge}</div></div></article>`;
  }
  list.innerHTML = out;
}
document.querySelectorAll(".filter").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filter").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
}));
document.querySelector(".search").addEventListener("input", ev => { query = ev.target.value.trim().toLowerCase(); render(); });
render();

document.getElementById("yr").textContent = new Date().getFullYear();
const menuBtn = document.querySelector(".menu-btn"), menu = document.getElementById("menu");
menuBtn.addEventListener("click", () => { const o = menu.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", o); });
const rev = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ en.target.classList.add("in"); rev.unobserve(en.target); } }), {threshold: .12});
document.querySelectorAll(".reveal").forEach(el => rev.observe(el));
</script>
